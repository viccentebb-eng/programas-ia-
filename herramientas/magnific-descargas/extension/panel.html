<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Descargas de Magnific</title>
<style>
  :root{color-scheme:light dark;--fg:#0a1730;--muted:#55657f;--line:#d9e3ef;--bg:#f8fafd;--card:#fff;--ok:#0b7a3b;--err:#c2360b;--run:#123a8c}
  @media (prefers-color-scheme:dark){:root{--fg:#e8eef8;--muted:#9fb0c8;--line:#2c3a52;--bg:#0f1726;--card:#16213a;--ok:#5fd08f;--err:#ff8a65;--run:#8fb4ff}}
  body{margin:0;padding:24px 16px;font:15px/1.5 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
  main{max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}
  p{margin:0 0 10px;color:var(--muted)}
  .aviso{padding:10px 12px;border-radius:8px;background:var(--card);border:1.5px solid var(--err);color:var(--fg)}
  .aviso:empty{display:none}
  .row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  button{border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--fg);color:var(--bg)}
  button.sec{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
  button:disabled{opacity:.5;cursor:default}
  ol{margin:0;padding-left:22px}
  li{margin:6px 0}li b{font-weight:600}
  small{display:block;color:var(--muted);word-break:break-word}
  .pendiente span{color:var(--muted)}.descargando span{color:var(--run)}.listo span{color:var(--ok)}.error span{color:var(--err)}
  textarea,input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--fg);font:13px/1.4 ui-monospace,monospace}
  textarea{height:140px}
  label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
  code{font-size:13px}
  details{margin-top:24px}
</style>
</head>
<body>
<main>
  <h1>Descargas de Magnific</h1>
  <p>Usa la sesión de Magnific de este Firefox: abre cada enlace y pulsa «Download» por ti, una a la vez. Nunca pulsa «Get Premium» ni compra nada. Si un archivo falla, su pestaña queda abierta con el motivo aquí abajo.</p>
  <p id="resumen"></p>
  <p id="aviso" class="aviso" role="status"></p>
  <div class="row">
    <button id="iniciar" type="button">Iniciar</button>
    <button id="detener" class="sec" type="button">Detener</button>
    <button id="manifiesto" class="sec" type="button">Guardar manifiesto</button>
  </div>
  <ol id="estado"></ol>
  <details>
    <summary>Cargar otra lista a mano</summary>
    <label for="lista">Lista (una por renglón: <code>nombre | enlace</code>)</label>
    <textarea id="lista" spellcheck="false" placeholder="sala-moderna | https://www.magnific.com/premium-photo/..."></textarea>
    <label for="carpeta">Carpeta dentro de Descargas</label>
    <input id="carpeta" value="magnific">
    <div class="row"><button id="cargar" class="sec" type="button">Cargar lista</button></div>
  </details>
</main>
<script src="panel.js"></script>
</body>
</html>
