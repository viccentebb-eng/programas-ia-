<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vista del panel (simulada)</title>
<link rel="stylesheet" href="../ProgramasIA/estilos.css">
<style>html { width: 380px; height: 760px; outline: 1px solid #000; }</style>
<script>
  // Simulacion minima de UXP e InDesign para ver el panel en un navegador
  window.require = function (m) {
    if (m === "uxp") return {
      storage: { formats: { utf8: "utf8", binary: "binary" }, localFileSystem: {
        getFileForOpening: async () => [], getPluginFolder: async () => ({}), getDataFolder: async () => ({}), getTemporaryFolder: async () => ({}) } },
      shell: { openExternal: (u) => console.log("abrir", u) }
    };
    if (m === "indesign") return { ScriptLanguage: { JAVASCRIPT: 1 }, app: {
      doScript: () => "", insertLabel: () => {}, extractLabel: () => "",
      documents: { itemByID: () => ({ isValid: false }) } } };
    throw new Error("sin " + m);
  };
  try {
    localStorage.setItem("pia_uso", JSON.stringify({ total: { usd: 1.84, n: 31, tin: 260000, tout: 140000 },
      meses: { [new Date().toISOString().slice(0, 7)]: { usd: 0.47, n: 8, tin: 70000, tout: 36000 } } }));
  } catch (e) {}
</script>
</head>
<body>
</body>
</html>
